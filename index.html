      try {

      } catch (e) {
        var _memStore = {};
        var _mockStorage = {
          getItem: function(k) { return Object.prototype.hasOwnProperty.call(_memStore, k) ? _memStore[k] : null; },
          setItem: function(k, v) { _memStore[k] = String(v); },
          removeItem: function(k) { delete _memStore[k]; },
          clear: function() { _memStore = {}; },
          key: function(i) { return Object.keys(_memStore)[i] || null; },
          get length() { return Object.keys(_memStore).length; }
        };
        try {
          Object.defineProperty(window, 'localStorage', { value: _mockStorage, configurable: true, writable: true });
          Object.defineProperty(window, 'sessionStorage', { value: _mockStorage, configurable: true, writable: true });
        } catch(err) {}
      }

      // Safe environment shim for matchMedia across all mobile browsers & webviews
      if (typeof window !== 'undefined' && (!window.matchMedia || typeof window.matchMedia !== 'function')) {
        window.matchMedia = function(q) {
          return {
            matches: false,
            media: q || '',
            onchange: null,
            addListener: function() {},
            removeListener: function() {},
            addEventListener: function() {},
            removeEventListener: function() {},
            dispatchEvent: function() { return false; },
          };
        };
      }
      if (typeof window !== 'undefined' && (typeof window.ResizeObserver === 'undefined')) {
        window.ResizeObserver = class {
          observe() {}
          unobserve() {}
          disconnect() {}
        };
      }
      if (typeof window !== 'undefined' && (typeof window.IntersectionObserver === 'undefined')) {

  <body>
    <div id="pg-boot-overlay" class="pg-boot-shell" aria-live="polite">
      <div class="pg-boot-badge">P</div>
      <div id="pg-boot-status" style="font-size: 13px; color: #52525b;">Loading workspace...</div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        window.__PG_MARK_MOUNTED__ = function () {
          window.__PG_APP_MOUNTED__ = true;
          var overlay = document.getElementById('pg-boot-overlay');
          if (overlay && overlay.parentNode) {
            overlay.parentNode.removeChild(overlay);
          }
        };

        function showBootRecovery(reason) {
          if (window.__PG_APP_MOUNTED__) return;
          var overlay = document.getElementById('pg-boot-overlay');
          if (!overlay) return;
          overlay.innerHTML =
            '<div class="pg-boot-badge">P</div>' +
            '<div style="font-weight:800;font-size:18px;">Unable to load PlantGrowth AI</div>' +
            '<div style="font-size:13px;color:#456449;max-width:360px;line-height:1.5;">' +
              (reason ? String(reason).slice(0, 160) : 'A module failed to initialize cleanly.') +
            '</div>' +
            '<button type="button" onclick="window.location.reload()" style="margin-top:6px;padding:10px 22px;border-radius:999px;border:none;background:#1c521b;color:#fff;font-weight:700;font-size:13px;cursor:pointer;">Reload Page</button>';
        }

        window.addEventListener('error', function (ev) {
          if (window.__PG_APP_MOUNTED__) return;
          var target = ev && ev.target;
          if (target && target.tagName === 'SCRIPT') {
            showBootRecovery('Failed to load application script module. Please reload.');
            return;
          }
          var msg = (ev && ev.message) || '';
          if (msg && !/ResizeObserver|Script error/i.test(msg)) {
            showBootRecovery(msg);
          }
        }, true);

        setTimeout(function () {
          if (!window.__PG_APP_MOUNTED__) {
            var st = document.getElementById('pg-boot-status');
            if (st) st.textContent = 'Still loading modules... Refresh if this persists.';
          }
        }, 9000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
